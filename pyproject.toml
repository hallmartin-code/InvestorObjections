[project]
name = "investor-toolkit"
version = "0.1.0"
description = "Turn an investor pitch deck into a branded one-pager PDF and a set of five follow-up emails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "TEN Capital Network" }]
keywords = ["investor", "pitch-deck", "venture-capital", "pdf", "claude", "anthropic"]

dependencies = [
    "pdfplumber>=0.11.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "anthropic>=0.121.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "pydantic>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[project.scripts]
investor-toolkit = "investor_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["investor_toolkit"]

[tool.setuptools.package-data]
investor_toolkit = ["templates/*.json", "templates/*.md", "web_templates/*.html", "static/*.png", "static/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Form() in argument defaults is the FastAPI dependency-injection idiom.
"investor_toolkit/web.py" = ["B008"]
